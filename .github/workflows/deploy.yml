name: deploy

# Production deploy on every push to main: migrate the database, deploy the API on Render, then build
# and upload the web to Cloudflare Pages. Values live in the `production` environment of this repository:
#   secrets: MIGRATE_CONNECTION_STRING, DATABASE_APP_PASSWORD, DATABASE_SYNC_PASSWORD,
#            RENDER_DEPLOY_HOOK_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variables: API_URL, SUPABASE_URL, SUPABASE_ANON_KEY, GITHUB_APP_SLUG (optional), PAGES_PROJECT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Migrate: ${{ secrets.MIGRATE_CONNECTION_STRING }}
      Database__AppPassword: ${{ secrets.DATABASE_APP_PASSWORD }}
      Database__SyncPassword: ${{ secrets.DATABASE_SYNC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Migrate
        working-directory: server/src/WorkBoard.Api
        run: dotnet run -c Release --no-launch-profile -- migrate

  api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$HOOK?ref=${GITHUB_SHA}" > /dev/null

  web:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ vars.GITHUB_APP_SLUG }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check the bundle points at production
        run: |
          grep -rqF "${NEXT_PUBLIC_SUPABASE_URL#https://}" out/_next/static
          grep -rqF "${NEXT_PUBLIC_API_URL#https://}" out/_next/static
          ! grep -rqE 'localhost:5080' out/_next/static

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx -y wrangler@4 pages deploy out --project-name "${{ vars.PAGES_PROJECT }}" --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}" --commit-dirty=true
